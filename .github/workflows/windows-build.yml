name: Build Coucou Hermes (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install Node dependencies
        run: npm ci

      - name: Build UI bundles
        run: npm run build:ui

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Coucou Hermes v__VERSION__'
          releaseBody: 'Coucou Hermes Windows Companion Release'
          releaseDraft: false
          prerelease: false

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-Hermes-portable
          path: |
            src-tauri/target/release/coucou.exe
          retention-days: 7
