name: Build Coucou Hermes (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install Node dependencies
        run: npm ci

      - name: Build UI bundles
        run: npm run build:ui

      - name: Build coucou-hook binary
        run: cargo build --release -p coucou-hook

      - name: Build Tauri app & NSIS installer
        run: npx tauri build

      - name: Pack release installer
        shell: pwsh
        run: |
          node scripts/pack.mjs
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-Hermes-Installer
          path: |
            release/*-setup.exe
          retention-days: 7

      - name: Upload portable binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-Hermes-portable
          path: |
            target/release/coucou.exe
            target/release/coucou-hook.exe
          retention-days: 7
